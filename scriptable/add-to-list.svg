<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded app-icon background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Checklist card -->
  <g filter="url(#shadow)">
    <rect x="118" y="120" width="220" height="240" rx="24" ry="24" fill="#0f3460"/>
  </g>

  <!-- Checklist rows -->
  <g stroke-linecap="round">
    <!-- Row 1: checked -->
    <circle cx="158" cy="176" r="14" fill="none" stroke="#00d4ff" stroke-width="6"/>
    <path d="M150 176 l6 7 l11 -14" fill="none" stroke="#00d4ff" stroke-width="6" stroke-linejoin="round"/>
    <rect x="186" y="168" width="120" height="16" rx="8" fill="#eaeaea"/>

    <!-- Row 2: checked -->
    <circle cx="158" cy="228" r="14" fill="none" stroke="#00d4ff" stroke-width="6"/>
    <path d="M150 228 l6 7 l11 -14" fill="none" stroke="#00d4ff" stroke-width="6" stroke-linejoin="round"/>
    <rect x="186" y="220" width="96" height="16" rx="8" fill="#eaeaea"/>

    <!-- Row 3: empty -->
    <circle cx="158" cy="280" r="14" fill="none" stroke="#6a7290" stroke-width="6"/>
    <rect x="186" y="272" width="110" height="16" rx="8" fill="#8a8a9a"/>

    <!-- Row 4: empty -->
    <circle cx="158" cy="332" r="14" fill="none" stroke="#6a7290" stroke-width="6"/>
    <rect x="186" y="324" width="80" height="16" rx="8" fill="#8a8a9a"/>
  </g>

  <!-- Plus badge -->
  <g filter="url(#shadow)">
    <circle cx="356" cy="356" r="64" fill="#00d4ff"/>
    <path d="M356 324 v64 M324 356 h64" stroke="#16213e" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="256" y="446" text-anchor="middle"
        font-family="-apple-system, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="700" fill="#ffffff">Add to List</text>
</svg>
