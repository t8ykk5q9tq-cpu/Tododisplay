<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Usage</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e; color: #eaeaea; min-height: 100vh; padding: 20px;
        }
        header {
            display: flex; align-items: baseline; justify-content: space-between;
            flex-wrap: wrap; gap: 10px; margin-bottom: 18px;
        }
        h1 { color: #00d4ff; font-size: 1.5rem; }
        .sub { color: #8a8a9a; font-size: 0.9rem; }
        .total { font-size: 1.1rem; }
        .total .v { color: #e94560; font-weight: 700; }
        .legend { display: flex; gap: 16px; font-size: 0.85rem; color: #8a8a9a; align-items: center; }
        .legend .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
        .grid {
            display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px;
        }
        @media (max-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 400px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        .pie {
            background: #16213e; border-radius: 12px; padding: 10px 6px 6px;
            display: flex; flex-direction: column; align-items: center;
        }
        .pie svg { width: 100%; height: auto; display: block; }
        .pie .hr { color: #eaeaea; font-size: 0.85rem; margin-top: 4px; }
        .pie .mins { color: #8a8a9a; font-size: 0.72rem; }
        .pie.active .hr { color: #e94560; font-weight: 600; }
        .net { color: #6a6a78; font-size: 0.85rem; margin-top: 16px; text-align: center; }
        .ribbon-wrap {
            background: #16213e; border-radius: 12px; padding: 14px 16px 8px;
            margin-bottom: 20px;
        }
        .ribbon-title { color: #8a8a9a; font-size: 0.85rem; margin-bottom: 8px; }
        .ribbon-wrap svg { width: 100%; height: auto; display: block; }
        .cards {
            margin-top: 20px; display: grid; gap: 14px;
            grid-template-columns: repeat(3, 1fr);
        }
        @media (max-width: 900px) { .cards { grid-template-columns: 1fr; } }
        .card { background: #16213e; border-radius: 12px; padding: 16px; }
        .card h2 { color: #00d4ff; font-size: 1.1rem; margin-bottom: 10px; }
        .row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 0.95rem; }
        .row.over { color: #e94560; }
        .row .t { color: #00d4ff; }
        .row.over .t { color: #e94560; }
        .row .opens { color: #6a6a78; font-size: 0.8rem; margin-left: 8px; }
        .fd-bar { height: 12px; border-radius: 6px; overflow: hidden; background: #e94560; margin: 8px 0; }
        .fd-bar > div { height: 100%; background: #00d4ff; }
        .muted { color: #8a8a9a; font-size: 0.85rem; }
        .weekrow { margin-top: 8px; }
        .weekrow .head { display: flex; justify-content: space-between; font-size: 0.9rem; }
        .wbars { display: flex; align-items: flex-end; gap: 4px; height: 40px; margin-top: 4px; }
        .wbars .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
        .wbars .b { width: 100%; background: #00d4ff; border-radius: 3px 3px 0 0; min-height: 3px; }
        .wbars .b.empty { background: #243056; }
        .wbars .d { font-size: 0.6rem; color: #6a6a78; margin-top: 2px; }
        .empty-note { color: #8a8a9a; font-style: italic; }
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab {
            padding: 7px 18px; border-radius: 999px; border: 1px solid #2a2f4a;
            background: #16213e; color: #8a8a9a; font-size: 0.95rem;
            cursor: pointer; font-weight: 600;
        }
        .tab.active { background: #00d4ff; color: #12122a; border-color: #00d4ff; }
        .site-nav { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 16px; }
        .site-nav a {
            padding: 0.4rem 0.9rem; border-radius: 999px; background: #16213e;
            color: #00d4ff; text-decoration: none; font-size: 0.85rem; font-weight: 600;
            border: 1px solid #22284a;
        }
        .site-nav a.active { background: #00d4ff; color: #12122a; border-color: #00d4ff; }
    </style>
</head>
<body>
    <nav class="site-nav" id="site-nav"></nav>
    <script>
    (function () {
        var host = location.hostname, proto = location.protocol;
        var p5000 = proto + "//" + host + ":5000", p5050 = proto + "//" + host + ":5050";
        var here = location.port + location.pathname.replace(/\/$/, "");
        var links = [
            ["Lists", p5000 + "/", "5000"],
            ["Board", p5000 + "/board", "5000/board"],
            ["Tracker", p5050 + "/", "5050"],
            ["Usage", p5050 + "/usage", "5050/usage"],
            ["Health", p5050 + "/health", "5050/health"],
        ];
        document.getElementById("site-nav").innerHTML = links.map(function (l) {
            var active = (here === l[2]) ? " class=\"active\"" : "";
            return "<a href=\"" + l[1] + "\"" + active + ">" + l[0] + "</a>";
        }).join("");
    })();
    </script>
    <header>
        <div>
            <h1>Screen Usage</h1>
            <div class="sub" id="date">Loading...</div>
        </div>
        <div class="total"><span class="v" id="total">--</span> <span id="total-label">min on phone today</span></div>
        <div class="legend" id="legend"></div>
    </header>

    <div class="tabs">
        <button class="tab active" id="tab-phone" data-source="phone">Phone</button>
        <button class="tab" id="tab-mac" data-source="mac">Mac</button>
    </div>

    <div class="ribbon-wrap">
        <div class="ribbon-title" id="ribbon-title">Last 2 hours</div>
        <div id="ribbon"></div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="cards">
        <div class="card">
            <h2>App Time - Today</h2>
            <div id="app-today"></div>
        </div>
        <div class="card">
            <h2>Focus vs Distraction</h2>
            <div id="focus"></div>
        </div>
        <div class="card">
            <h2>Mac - This Week</h2>
            <div id="mac-week-card"></div>
        </div>
    </div>

    <div class="net" id="net"></div>

    <script>
        const R = 46;         // outer radius
        const CX = 50, CY = 50;
        const IDLE = "#243056";
        const HUB = "#16213e";
        let COLORS = {};              // app -> hex, from the API
        let DEFAULT_COLOR = "#9b6dff";
        let SOURCE = "phone";         // "phone" or "mac" — set by the tabs

        function colorFor(app) {
            if (!app) return DEFAULT_COLOR;      // used, app unknown (legacy)
            return COLORS[app] || DEFAULT_COLOR;
        }

        // Point on the circle for a given minute (0..60), 0 = top (12 o'clock),
        // clockwise. Returns [x, y].
        function pt(minute, radius) {
            const ang = (minute / 60) * 2 * Math.PI - Math.PI / 2;
            return [CX + radius * Math.cos(ang), CY + radius * Math.sin(ang)];
        }

        // Build one hour's pie as an SVG string. `hourApps` maps
        // minute-of-hour (0..59) -> app name (or "" if used-but-unknown).
        function buildPie(hour, hourApps) {
            let wedges = "";
            for (let m = 0; m < 60; m++) {
                const [x1, y1] = pt(m, R);
                const [x2, y2] = pt(m + 1, R);
                const app = hourApps[m];
                const color = (app === undefined) ? IDLE : colorFor(app);
                // wedge: center -> edge(m) -> arc -> edge(m+1) -> close
                wedges += `<path d="M${CX},${CY} L${x1.toFixed(2)},${y1.toFixed(2)} `
                    + `A${R},${R} 0 0 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" `
                    + `fill="${color}" stroke="#16213e" stroke-width="0.4"/>`;
            }
            // small hub circle for a clean center
            const hub = `<circle cx="${CX}" cy="${CY}" r="8" fill="${HUB}"/>`;
            const label = String(hour).padStart(2, "0");
            return `<svg viewBox="0 0 100 100" role="img" aria-label="Hour ${label}">`
                + wedges + hub
                + `<text x="${CX}" y="${CY + 3}" text-anchor="middle" `
                + `font-size="12" fill="#8a8a9a">${label}</text></svg>`;
        }

        function hourLabel(h) {
            const ampm = h < 12 ? "am" : "pm";
            let disp = h % 12; if (disp === 0) disp = 12;
            return `${disp}${ampm}`;
        }

        // Build the continuous 24-hour ribbon. `mins` is {minuteOfDay: app}.
        // The bar is an SVG stretched to full width (1 unit = 1 minute); hour
        // labels are a separate HTML row below so text isn't distorted by the
        // horizontal stretch.
        function buildRibbon(mins) {
            const W = 1440, BAR = 34;
            let bars = `<rect x="0" y="0" width="${W}" height="${BAR}" fill="#243056"/>`;
            Object.keys(mins).forEach(k => {
                const md = parseInt(k, 10);
                if (md < 0 || md >= W) return;
                bars += `<rect x="${md}" y="0" width="1.2" height="${BAR}" `
                    + `fill="${colorFor(mins[k])}"/>`;
            });
            // Hour gridlines inside the bar (thin, uniform).
            let ticks = "";
            for (let h = 1; h < 24; h++) {
                const x = h * 60;
                ticks += `<line x1="${x}" y1="0" x2="${x}" y2="${BAR}" `
                    + `stroke="#1a1a2e" stroke-width="0.5"/>`;
            }
            const svg = `<svg viewBox="0 0 ${W} ${BAR}" preserveAspectRatio="none" `
                + `style="height:${BAR}px;border-radius:4px" role="img" `
                + `aria-label="24-hour usage timeline">${bars}${ticks}</svg>`;
            // HTML label row: a mark every 3 hours, spaced by percentage so it
            // lines up with the stretched bar above.
            let labels = '<div style="position:relative;height:16px;margin-top:2px">';
            for (let h = 0; h <= 24; h += 3) {
                const pct = (h / 24) * 100;
                const align = h === 24 ? "translateX(-100%)" : (h === 0 ? "" : "translateX(-50%)");
                labels += `<span style="position:absolute;left:${pct}%;`
                    + `${align ? "transform:" + align + ";" : ""}`
                    + `font-size:0.72rem;color:#6a6a78">${h === 24 ? "12am" : hourLabel(h)}</span>`;
            }
            labels += '</div>';
            return svg + labels;
        }

        async function refresh() {
            let d;
            try {
                d = await (await fetch("/usage-data?source=" + SOURCE, { cache: "no-store" })).json();
                document.getElementById("net").textContent = "";
            } catch (e) {
                document.getElementById("net").textContent = "Offline - retrying...";
                return;
            }

            COLORS = d.colors || {};
            DEFAULT_COLOR = d.default_color || DEFAULT_COLOR;

            // Group minute-of-day -> app into per-hour maps {minuteOfHour: app}.
            const byHour = Array.from({ length: 24 }, () => ({}));
            const counts = new Array(24).fill(0);
            const mins = d.minutes || {};
            Object.keys(mins).forEach(k => {
                const md = parseInt(k, 10);
                const h = Math.floor(md / 60), m = md % 60;
                if (h >= 0 && h < 24) { byHour[h][m] = mins[k]; counts[h]++; }
            });

            document.getElementById("date").textContent = d.date || "";
            document.getElementById("total").textContent = d.total_minutes ?? 0;
            document.getElementById("total-label").textContent =
                (SOURCE === "mac") ? "min on Mac today" : "min on phone today";
            renderLegend(d.per_app || {});
            document.getElementById("ribbon").innerHTML = buildRibbon(mins);
            renderAppToday(d.app_today);
            renderFocus(d.focus);
            renderMacWeek(d.mac_week);

            const grid = document.getElementById("grid");
            grid.innerHTML = "";
            for (let h = 0; h < 24; h++) {
                const cell = document.createElement("div");
                cell.className = "pie" + (counts[h] ? " active" : "");
                cell.innerHTML = buildPie(h, byHour[h])
                    + `<div class="hr">${hourLabel(h)}</div>`
                    + `<div class="mins">${counts[h] ? counts[h] + " min" : "-"}</div>`;
                grid.appendChild(cell);
            }
        }

        function renderLegend(perApp) {
            const el = document.getElementById("legend");
            // Sort apps by minutes desc; keep "no use" swatch at the end.
            const apps = Object.keys(perApp).sort((a, b) => perApp[b] - perApp[a]);
            let html = apps.map(a =>
                `<span><span class="swatch" style="background:${colorFor(a === "Other" ? "" : a)}"></span>`
                + `${a} <span style="color:#6a6a78">${perApp[a]}m</span></span>`
            ).join("");
            html += `<span><span class="swatch" style="background:#243056"></span>no use</span>`;
            el.innerHTML = html;
        }

        function fmtDur(s) {
            const m = Math.floor(s / 60), h = Math.floor(m / 60), mm = m % 60;
            return h ? `${h}h ${mm}m` : `${mm}m`;
        }
        function esc(s) {
            const dv = document.createElement("div"); dv.textContent = s; return dv.innerHTML;
        }

        function renderAppToday(list) {
            const el = document.getElementById("app-today");
            if (!list || list.length === 0) { el.innerHTML = '<div class="empty-note">None today</div>'; return; }
            el.innerHTML = list.map(a => {
                const cls = a.over_limit ? " over" : "";
                const name = a.app.replace("Mac:", "");
                return `<div class="row${cls}"><span>${esc(name)}${a.over_limit ? " \u26a0" : ""}</span>`
                    + `<span><span class="t">${fmtDur(a.seconds)}</span>`
                    + (a.opens ? `<span class="opens">${a.opens}\u00d7</span>` : "") + `</span></div>`;
            }).join("");
        }

        function renderFocus(fs) {
            const el = document.getElementById("focus");
            if (!fs || (!fs.focus_sec && !fs.distraction_sec)) {
                el.innerHTML = '<div class="empty-note">No data yet</div>'; return;
            }
            const f = fs.focus_sec, d = fs.distraction_sec, total = f + d || 1;
            const fpct = Math.round((f / total) * 100);
            el.innerHTML =
                `<div class="row"><span style="color:#00d4ff">Focus</span><span class="t">${fmtDur(f)}</span></div>`
                + `<div class="row over"><span>Distraction</span><span>${fmtDur(d)}</span></div>`
                + `<div class="fd-bar"><div style="width:${fpct}%"></div></div>`
                + (fs.longest_focus_sec ? `<div class="muted">Longest focus streak: ${fmtDur(fs.longest_focus_sec)}</div>` : "");
        }

        function renderMacWeek(mw) {
            const el = document.getElementById("mac-week-card");
            if (!mw || !mw.apps || mw.apps.length === 0) {
                el.innerHTML = '<div class="empty-note">No Mac data this week</div>'; return;
            }
            const days = mw.days || [];
            el.innerHTML = mw.apps.map(a => {
                const peak = Math.max(1, ...a.daily);
                const bars = a.daily.map((sec, i) => {
                    const h = sec > 0 ? Math.max(8, Math.round((sec / peak) * 100)) : 5;
                    const cls = sec > 0 ? "b" : "b empty";
                    return `<div class="col"><div class="${cls}" style="height:${h}%"></div><div class="d">${(days[i] || "")[0] || ""}</div></div>`;
                }).join("");
                return `<div class="weekrow"><div class="head"><span>${esc(a.app.replace("Mac:", ""))}</span>`
                    + `<span class="t">${fmtDur(a.seconds)}</span></div><div class="wbars">${bars}</div></div>`;
            }).join("");
        }

        // Tab switcher: Phone / Mac.
        function selectTab(source) {
            SOURCE = source;
            document.getElementById("tab-phone").classList.toggle("active", source === "phone");
            document.getElementById("tab-mac").classList.toggle("active", source === "mac");
            refresh();
        }
        document.getElementById("tab-phone").addEventListener("click", () => selectTab("phone"));
        document.getElementById("tab-mac").addEventListener("click", () => selectTab("mac"));

        setInterval(refresh, 30000);
        refresh();
    </script>
</body>
</html>
