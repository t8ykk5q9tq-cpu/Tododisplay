<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Usage</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e; color: #eaeaea; min-height: 100vh; padding: 20px;
        }
        header {
            display: flex; align-items: baseline; justify-content: space-between;
            flex-wrap: wrap; gap: 10px; margin-bottom: 18px;
        }
        h1 { color: #00d4ff; font-size: 1.5rem; }
        .sub { color: #8a8a9a; font-size: 0.9rem; }
        .total { font-size: 1.1rem; }
        .total .v { color: #e94560; font-weight: 700; }
        .legend { display: flex; gap: 16px; font-size: 0.85rem; color: #8a8a9a; align-items: center; }
        .legend .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
        .grid {
            display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px;
        }
        @media (max-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 400px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        .pie {
            background: #16213e; border-radius: 12px; padding: 10px 6px 6px;
            display: flex; flex-direction: column; align-items: center;
        }
        .pie svg { width: 100%; height: auto; display: block; }
        .pie .hr { color: #eaeaea; font-size: 0.85rem; margin-top: 4px; }
        .pie .mins { color: #8a8a9a; font-size: 0.72rem; }
        .pie.active .hr { color: #e94560; font-weight: 600; }
        .net { color: #6a6a78; font-size: 0.85rem; margin-top: 16px; text-align: center; }
        .ribbon-wrap {
            background: #16213e; border-radius: 12px; padding: 14px 16px 8px;
            margin-bottom: 20px;
        }
        .ribbon-title { color: #8a8a9a; font-size: 0.85rem; margin-bottom: 8px; }
        .ribbon-wrap svg { width: 100%; height: auto; display: block; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Screen Usage</h1>
            <div class="sub" id="date">Loading...</div>
        </div>
        <div class="total"><span class="v" id="total">--</span> min on phone today</div>
        <div class="legend" id="legend"></div>
    </header>

    <div class="ribbon-wrap">
        <div class="ribbon-title">Full day &mdash; midnight to midnight</div>
        <div id="ribbon"></div>
    </div>

    <div class="grid" id="grid"></div>
    <div class="net" id="net"></div>

    <script>
        const R = 46;         // outer radius
        const CX = 50, CY = 50;
        const IDLE = "#243056";
        const HUB = "#16213e";
        let COLORS = {};              // app -> hex, from the API
        let DEFAULT_COLOR = "#9b6dff";

        function colorFor(app) {
            if (!app) return DEFAULT_COLOR;      // used, app unknown (legacy)
            return COLORS[app] || DEFAULT_COLOR;
        }

        // Point on the circle for a given minute (0..60), 0 = top (12 o'clock),
        // clockwise. Returns [x, y].
        function pt(minute, radius) {
            const ang = (minute / 60) * 2 * Math.PI - Math.PI / 2;
            return [CX + radius * Math.cos(ang), CY + radius * Math.sin(ang)];
        }

        // Build one hour's pie as an SVG string. `hourApps` maps
        // minute-of-hour (0..59) -> app name (or "" if used-but-unknown).
        function buildPie(hour, hourApps) {
            let wedges = "";
            for (let m = 0; m < 60; m++) {
                const [x1, y1] = pt(m, R);
                const [x2, y2] = pt(m + 1, R);
                const app = hourApps[m];
                const color = (app === undefined) ? IDLE : colorFor(app);
                // wedge: center -> edge(m) -> arc -> edge(m+1) -> close
                wedges += `<path d="M${CX},${CY} L${x1.toFixed(2)},${y1.toFixed(2)} `
                    + `A${R},${R} 0 0 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" `
                    + `fill="${color}" stroke="#16213e" stroke-width="0.4"/>`;
            }
            // small hub circle for a clean center
            const hub = `<circle cx="${CX}" cy="${CY}" r="8" fill="${HUB}"/>`;
            const label = String(hour).padStart(2, "0");
            return `<svg viewBox="0 0 100 100" role="img" aria-label="Hour ${label}">`
                + wedges + hub
                + `<text x="${CX}" y="${CY + 3}" text-anchor="middle" `
                + `font-size="12" fill="#8a8a9a">${label}</text></svg>`;
        }

        function hourLabel(h) {
            const ampm = h < 12 ? "am" : "pm";
            let disp = h % 12; if (disp === 0) disp = 12;
            return `${disp}${ampm}`;
        }

        // Build the continuous 24-hour ribbon. `mins` is {minuteOfDay: app}.
        // The bar is an SVG stretched to full width (1 unit = 1 minute); hour
        // labels are a separate HTML row below so text isn't distorted by the
        // horizontal stretch.
        function buildRibbon(mins) {
            const W = 1440, BAR = 34;
            let bars = `<rect x="0" y="0" width="${W}" height="${BAR}" fill="#243056"/>`;
            Object.keys(mins).forEach(k => {
                const md = parseInt(k, 10);
                if (md < 0 || md >= W) return;
                bars += `<rect x="${md}" y="0" width="1.2" height="${BAR}" `
                    + `fill="${colorFor(mins[k])}"/>`;
            });
            // Hour gridlines inside the bar (thin, uniform).
            let ticks = "";
            for (let h = 1; h < 24; h++) {
                const x = h * 60;
                ticks += `<line x1="${x}" y1="0" x2="${x}" y2="${BAR}" `
                    + `stroke="#1a1a2e" stroke-width="0.5"/>`;
            }
            const svg = `<svg viewBox="0 0 ${W} ${BAR}" preserveAspectRatio="none" `
                + `style="height:${BAR}px;border-radius:4px" role="img" `
                + `aria-label="24-hour usage timeline">${bars}${ticks}</svg>`;
            // HTML label row: a mark every 3 hours, spaced by percentage so it
            // lines up with the stretched bar above.
            let labels = '<div style="position:relative;height:16px;margin-top:2px">';
            for (let h = 0; h <= 24; h += 3) {
                const pct = (h / 24) * 100;
                const align = h === 24 ? "translateX(-100%)" : (h === 0 ? "" : "translateX(-50%)");
                labels += `<span style="position:absolute;left:${pct}%;`
                    + `${align ? "transform:" + align + ";" : ""}`
                    + `font-size:0.72rem;color:#6a6a78">${h === 24 ? "12am" : hourLabel(h)}</span>`;
            }
            labels += '</div>';
            return svg + labels;
        }

        async function refresh() {
            let d;
            try {
                d = await (await fetch("/usage-data", { cache: "no-store" })).json();
                document.getElementById("net").textContent = "";
            } catch (e) {
                document.getElementById("net").textContent = "Offline - retrying...";
                return;
            }

            COLORS = d.colors || {};
            DEFAULT_COLOR = d.default_color || DEFAULT_COLOR;

            // Group minute-of-day -> app into per-hour maps {minuteOfHour: app}.
            const byHour = Array.from({ length: 24 }, () => ({}));
            const counts = new Array(24).fill(0);
            const mins = d.minutes || {};
            Object.keys(mins).forEach(k => {
                const md = parseInt(k, 10);
                const h = Math.floor(md / 60), m = md % 60;
                if (h >= 0 && h < 24) { byHour[h][m] = mins[k]; counts[h]++; }
            });

            document.getElementById("date").textContent = d.date || "";
            document.getElementById("total").textContent = d.total_minutes ?? 0;
            renderLegend(d.per_app || {});
            document.getElementById("ribbon").innerHTML = buildRibbon(mins);

            const grid = document.getElementById("grid");
            grid.innerHTML = "";
            for (let h = 0; h < 24; h++) {
                const cell = document.createElement("div");
                cell.className = "pie" + (counts[h] ? " active" : "");
                cell.innerHTML = buildPie(h, byHour[h])
                    + `<div class="hr">${hourLabel(h)}</div>`
                    + `<div class="mins">${counts[h] ? counts[h] + " min" : "-"}</div>`;
                grid.appendChild(cell);
            }
        }

        function renderLegend(perApp) {
            const el = document.getElementById("legend");
            // Sort apps by minutes desc; keep "no use" swatch at the end.
            const apps = Object.keys(perApp).sort((a, b) => perApp[b] - perApp[a]);
            let html = apps.map(a =>
                `<span><span class="swatch" style="background:${colorFor(a === "Other" ? "" : a)}"></span>`
                + `${a} <span style="color:#6a6a78">${perApp[a]}m</span></span>`
            ).join("");
            html += `<span><span class="swatch" style="background:#243056"></span>no use</span>`;
            el.innerHTML = html;
        }

        setInterval(refresh, 30000);
        refresh();
    </script>
</body>
</html>
