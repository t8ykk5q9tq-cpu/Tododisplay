<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Review</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e; color: #eaeaea; min-height: 100vh; padding: 20px;
        }
        header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
        h1 { color: #00d4ff; font-size: 1.6rem; }
        .sub { color: #8a8a9a; font-size: 0.9rem; }
        .updated { color: #6a6a78; font-size: 0.85rem; }
        .site-nav { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 16px; }
        .site-nav a {
            padding: 0.4rem 0.9rem; border-radius: 999px; background: #16213e;
            color: #00d4ff; text-decoration: none; font-size: 0.85rem; font-weight: 600;
            border: 1px solid #22284a;
        }
        .site-nav a.active { background: #00d4ff; color: #12122a; border-color: #00d4ff; }

        /* Headline stat cards */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
        @media (max-width: 820px) { .stats { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 460px) { .stats { grid-template-columns: 1fr; } }
        .stat { background: #16213e; border-radius: 14px; padding: 16px; }
        .stat .lab { color: #8a8a9a; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
        .stat .val { font-size: 1.7rem; font-weight: 700; margin-top: 6px; }
        .stat .val .u { font-size: 0.9rem; color: #8a8a9a; font-weight: 400; margin-left: 4px; }
        .stat .note { color: #8a8a9a; font-size: 0.82rem; margin-top: 4px; }
        .up { color: #e94560; } .down { color: #2ecc71; } .good { color: #00d4ff; }

        /* Charts */
        .charts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        @media (max-width: 820px) { .charts { grid-template-columns: 1fr; } }
        .chart { background: #16213e; border-radius: 14px; padding: 16px; }
        .chart h2 { color: #00d4ff; font-size: 1rem; margin-bottom: 4px; }
        .chart .cnote { color: #8a8a9a; font-size: 0.8rem; margin-bottom: 6px; }
        .bars { display: flex; align-items: flex-end; gap: 6px; height: 92px; margin-top: 8px; }
        .bars .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
        .bars .stack { width: 100%; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; border-radius: 3px 3px 0 0; overflow: hidden; }
        .bars .seg { width: 100%; }
        .bars .b { width: 100%; border-radius: 3px 3px 0 0; min-height: 3px; }
        .bars .v { font-size: 0.6rem; color: #8a8a9a; margin-bottom: 3px; }
        .bars .d { font-size: 0.65rem; color: #6a6a78; margin-top: 4px; }
        .legend { display: flex; gap: 14px; font-size: 0.78rem; color: #8a8a9a; margin-top: 8px; }
        .legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
        .empty { color: #8a8a9a; font-style: italic; }
        .net { color: #6a6a78; font-size: 0.85rem; margin-top: 18px; text-align: center; }
    </style>
</head>
<body>
    <nav class="site-nav" id="site-nav"></nav>
    <script>
    (function () {
        var host = location.hostname, proto = location.protocol;
        var p5000 = proto + "//" + host + ":5000", p5050 = proto + "//" + host + ":5050";
        var here = location.port + location.pathname.replace(/\/$/, "");
        var links = [
            ["Lists", p5000 + "/", "5000"],
            ["Board", p5000 + "/board", "5000/board"],
            ["Tracker", p5050 + "/", "5050"],
            ["Usage", p5050 + "/usage", "5050/usage"],
            ["Health", p5050 + "/health", "5050/health"],
            ["Weekly", p5050 + "/weekly-review", "5050/weekly-review"],
        ];
        document.getElementById("site-nav").innerHTML = links.map(function (l) {
            var active = (here === l[2]) ? " class=\"active\"" : "";
            return "<a href=\"" + l[1] + "\"" + active + ">" + l[0] + "</a>";
        }).join("");
    })();
    </script>

    <header>
        <div>
            <h1>Weekly Review</h1>
            <div class="sub">The last 7 days</div>
        </div>
        <div class="updated" id="updated"></div>
    </header>

    <div class="stats" id="stats"></div>
    <div class="charts" id="charts"></div>
    <div class="net" id="net"></div>

    <script>
        const $ = id => document.getElementById(id);
        const fmtHrs = s => { const m = Math.round(s / 60); const h = Math.floor(m / 60); return h ? `${h}h ${m % 60}m` : `${m}m`; };
        const fmtMin = m => { const h = Math.floor(m / 60); return h ? `${h}h ${m % 60}m` : `${m}m`; };

        function statCard(lab, val, unit, note, noteCls) {
            return `<div class="stat"><div class="lab">${lab}</div>` +
                `<div class="val">${val}${unit ? `<span class="u">${unit}</span>` : ""}</div>` +
                (note ? `<div class="note ${noteCls || ""}">${note}</div>` : "") + `</div>`;
        }

        // Simple single-series bar chart. rows: numbers; fmt(v)->top label.
        function barChart(title, note, labels, values, color, fmt) {
            const peak = Math.max(1, ...values);
            const bars = values.map((v, i) => {
                const h = v > 0 ? Math.max(6, Math.round((v / peak) * 100)) : 4;
                const top = v > 0 ? fmt(v) : "";
                return `<div class="col"><div class="v">${top}</div>` +
                    `<div class="b" style="height:${h}%;background:${v > 0 ? color : "#243056"}"></div>` +
                    `<div class="d">${labels[i]}</div></div>`;
            }).join("");
            return `<div class="chart"><h2>${title}</h2>` +
                (note ? `<div class="cnote">${note}</div>` : "") +
                `<div class="bars">${bars}</div></div>`;
        }

        // Stacked bar chart (focus vs distraction). aVals/bVals per day.
        function stackedChart(title, note, labels, aVals, bVals, aCol, bCol, aName, bName) {
            const peak = Math.max(1, ...aVals.map((a, i) => a + bVals[i]));
            const bars = aVals.map((a, i) => {
                const b = bVals[i];
                const total = a + b;
                const hTotal = total > 0 ? Math.max(6, Math.round((total / peak) * 100)) : 4;
                const aPct = total > 0 ? (a / total) * 100 : 0;
                const bPct = total > 0 ? (b / total) * 100 : 0;
                return `<div class="col">` +
                    `<div class="stack" style="height:${hTotal}%">` +
                        `<div class="seg" style="height:${bPct}%;background:${bCol}"></div>` +
                        `<div class="seg" style="height:${aPct}%;background:${aCol}"></div>` +
                    `</div><div class="d">${labels[i]}</div></div>`;
            }).join("");
            return `<div class="chart"><h2>${title}</h2>` +
                (note ? `<div class="cnote">${note}</div>` : "") +
                `<div class="bars">${bars}</div>` +
                `<div class="legend"><span><span class="sw" style="background:${aCol}"></span>${aName}</span>` +
                `<span><span class="sw" style="background:${bCol}"></span>${bName}</span></div></div>`;
        }

        function fmtClock(min) {
            if (min == null) return "--";
            const h = Math.floor(((min % 1440) + 1440) % 1440 / 60), m = ((min % 60) + 60) % 60;
            return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
        }

        async function refresh() {
            let d;
            try { d = await (await fetch("/weekly-review-data", { cache: "no-store" })).json(); $("net").textContent = ""; }
            catch (e) { $("net").textContent = "Offline - retrying..."; return; }

            const L = d.labels || [];

            // --- Headline stat cards ---
            const foc = d.focus, sl = d.sleep, hab = d.habits, mo = d.mood,
                  wa = d.water, wt = d.weight, us = d.usage, ci = d.checkins;
            let wtNote = "", wtCls = "";
            if (wt.change != null) {
                wtCls = wt.change > 0 ? "up" : "down";
                wtNote = `${wt.change > 0 ? "+" : ""}${wt.change} ${wt.unit} this week`;
            }
            $("stats").innerHTML =
                statCard("Focus", fmtHrs(foc.total_sec), "", `${fmtHrs(foc.distraction_sec)} distraction`) +
                statCard("Avg Sleep", sl.avg_duration_min ? fmtMin(sl.avg_duration_min) : "--", "",
                         sl.bedtime_regularity_min != null ? `bed \u00b1${sl.bedtime_regularity_min}m, avg ${fmtClock(sl.avg_bedtime_min)}` : `${sl.nights} nights`) +
                statCard("Habits", hab.percent + "%", "", `${hab.done}/${hab.total} done`) +
                statCard("Check-ins", ci.total, "", "logged this week") +
                statCard("Avg Mood", mo.avg != null ? mo.avg : "--", mo.avg != null ? "/5" : "", "") +
                statCard("Water", wa.hits + "/7", "", "days goal hit") +
                statCard("Phone", fmtMin(us.phone_total), "", `Computer ${fmtMin(us.mac_total)}`) +
                statCard(wt.label || "Weight", wt.latest != null ? wt.latest : "--", wt.latest != null ? wt.unit : "", wtNote, wtCls);

            // --- Charts ---
            const charts = [];
            charts.push(stackedChart("Focus vs Distraction", "hours per day", L,
                foc.focus_by_day, foc.distraction_by_day, "#00d4ff", "#e94560", "Focus", "Distraction"));
            charts.push(barChart("Sleep", "hours per night", L, sl.series_min, "#9b6dff", v => (v / 60).toFixed(1) + "h"));
            charts.push(stackedChart("Screen time", "minutes per day", L,
                us.mac_min, us.phone_min, "#00d4ff", "#e94560", "Computer", "Phone"));
            charts.push(barChart("Mood", "avg per day (/5)", L, mo.series, "#f5a623", v => v.toFixed(1)));
            charts.push(barChart("Water", "bottles per day", L, wa.series, "#00d4ff", v => v));
            charts.push(barChart("Check-ins", "per day", L, ci.series, "#2ecc71", v => v));
            if (d.steps && d.steps.series) {
                charts.push(barChart("Steps", "per day", L, d.steps.series, "#00d4ff",
                    v => v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + "k" : String(v)));
            }
            $("charts").innerHTML = charts.join("");

            $("updated").textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        }

        setInterval(refresh, 60000);
        refresh();
    </script>
</body>
</html>
