<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #eaeaea;
            min-height: 100vh;
            padding: 1.25rem;
        }
        h1 { font-size: 1.5rem; color: #00d4ff; text-align: center; margin-bottom: 1rem; }
        .card {
            background: #16213e;
            border-radius: 1rem;
            padding: 1.25rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }
        .countdown { text-align: center; }
        .countdown .time { font-size: 2.5rem; font-weight: 700; color: #eaeaea; }
        .countdown .label { color: #8a8a9a; font-size: 0.9rem; }
        .countdown.pending .time { color: #e94560; }
        .add-form { display: flex; gap: 0.5rem; }
        .add-form input {
            flex: 1; padding: 0.9rem 1rem; border: 2px solid #0f3460;
            border-radius: 0.5rem; background: #0f3460; color: #eaeaea;
            font-size: 16px; outline: none;
        }
        .add-form input:focus { border-color: #00d4ff; }
        .add-form button {
            padding: 0.9rem 1.25rem; border: none; border-radius: 0.5rem;
            background: #00d4ff; color: #1a1a2e; font-size: 1.1rem;
            font-weight: bold; cursor: pointer;
        }
        .recent-title { font-size: 0.85rem; color: #8a8a9a; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .recent-item { padding: 0.6rem 0; border-bottom: 1px solid #0f3460; }
        .recent-item:last-child { border-bottom: none; }
        .recent-item .t { color: #00d4ff; font-size: 0.8rem; }
        .recent-item .x { color: #eaeaea; }
        .btn-row { display: flex; gap: 0.5rem; }
        .btn-row button {
            flex: 1; padding: 0.8rem; border: 1px solid #0f3460;
            border-radius: 0.5rem; background: transparent; color: #8a8a9a;
            font-size: 0.95rem; cursor: pointer;
        }
        .btn-row button:hover { color: #00d4ff; border-color: #00d4ff; }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
        .awake { background: #4caf50; }
        .asleep { background: #8a8a9a; }
        /* Quick-pick category buttons */
        .quick-title { font-size: 0.85rem; color: #8a8a9a; margin-bottom: 0.6rem;
            text-transform: uppercase; letter-spacing: 0.05em; }
        .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
        .quick-grid button {
            padding: 0.9rem 0.5rem; border: 2px solid #0f3460; border-radius: 0.6rem;
            background: #0f3460; color: #eaeaea; font-size: 1rem; cursor: pointer;
        }
        .quick-grid button:active { background: #00d4ff; color: #1a1a2e; }
        .recent-item .cat { display: inline-block; font-size: 0.7rem; color: #1a1a2e;
            background: #00d4ff; border-radius: 0.3rem; padding: 1px 6px; margin-left: 6px; }
        /* Today summary */
        .sum-row { display: flex; justify-content: space-between; padding: 0.4rem 0;
            border-bottom: 1px solid #0f3460; }
        .sum-row:last-child { border-bottom: none; }
        .sum-cat { color: #eaeaea; }
        .sum-time { color: #00d4ff; }
        .sum-total { color: #8a8a9a; font-size: 0.85rem; margin-top: 0.5rem; }
        /* Mood buttons */
        .mood-row { display: flex; gap: 0.5rem; justify-content: space-between; }
        .mood-btn {
            flex: 1; padding: 0.7rem 0; border: 2px solid #0f3460; border-radius: 0.6rem;
            background: #0f3460; font-size: 1.5rem; cursor: pointer;
        }
        .mood-btn:active { background: #00d4ff; }
        /* Water counter */
        .water-row { display: flex; align-items: center; gap: 0.6rem; }
        .water-btn {
            flex: 0 0 auto; width: 3rem; height: 3rem; border: 2px solid #0f3460;
            border-radius: 0.6rem; background: #0f3460; color: #eaeaea;
            font-size: 1.6rem; cursor: pointer;
        }
        .water-btn:active { background: #00d4ff; }
        .water-count { flex: 1; text-align: center; font-size: 1.3rem; }
        .water-count .g { color: #00d4ff; font-weight: 600; }
        .bar-track { height: 12px; border-radius: 6px; background: #0f3460; overflow: hidden; margin-top: 0.6rem; }
        .bar-fill { height: 100%; background: #00d4ff; transition: width 0.3s; }
        .bar-fill.full { background: #2ecc71; }
        /* Metric input + sparkline */
        .metric-form { display: flex; gap: 0.5rem; }
        .metric-form input {
            flex: 1; padding: 0.7rem; border: none; border-radius: 0.6rem;
            background: #0f3460; color: #eaeaea; font-size: 1rem;
        }
        .metric-form button {
            flex: 0 0 auto; padding: 0 1.1rem; border: none; border-radius: 0.6rem;
            background: #00d4ff; color: #12122a; font-weight: 600; cursor: pointer;
        }
        .metric-latest { font-size: 1.4rem; margin-bottom: 0.4rem; }
        .metric-latest .v { color: #00d4ff; font-weight: 600; }
        .metric-latest .up { color: #e94560; }
        .metric-latest .down { color: #2ecc71; }
        .spark { display: flex; align-items: flex-end; gap: 3px; height: 46px; margin-top: 0.5rem; }
        .spark .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
        .spark .b { width: 100%; background: #00d4ff; border-radius: 2px 2px 0 0; min-height: 3px; }
        /* App usage rows */
        .app-row { display: flex; justify-content: space-between; align-items: baseline;
            padding: 0.4rem 0; border-bottom: 1px solid #0f3460; }
        .app-row:last-child { border-bottom: none; }
        .app-name { color: #eaeaea; }
        .app-val { color: #00d4ff; }
        .app-opens { color: #8a8a9a; font-size: 0.8rem; margin-left: 6px; }
        /* Weekly mini bar chart per app */
        .week-app { margin-bottom: 0.9rem; }
        .week-head { display: flex; justify-content: space-between; margin-bottom: 0.35rem; }
        .week-bars { display: flex; gap: 4px; align-items: flex-end; height: 44px; }
        .week-bar-col { flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-end; height: 100%; }
        .week-bar { width: 100%; background: #00d4ff; border-radius: 3px 3px 0 0;
            min-height: 2px; }
        .week-bar.empty { background: #0f3460; }
        .week-day { color: #8a8a9a; font-size: 0.6rem; margin-top: 2px; }
    </style>
</head>
<body>
    <h1>Time Tracker</h1>

    <div class="card countdown" id="countdown">
        <div class="time" id="cd-time">--:--</div>
        <div class="label" id="cd-label">until next check-in</div>
    </div>

    <!-- Check-in compliance -->
    <div class="card" id="compliance-card"></div>

    <!-- Quick-pick buttons: one tap logs that category -->
    <div class="card">
        <div class="quick-title">Quick check-in</div>
        <div class="quick-grid" id="quick-grid"></div>
    </div>

    <!-- Free-text with optional category -->
    <div class="card">
        <form class="add-form" id="add-form">
            <input type="text" id="entry" placeholder="Something else..." autocomplete="off">
            <button type="submit">Log</button>
        </form>
    </div>

    <!-- Mood check-in -->
    <div class="card">
        <div class="recent-title">Mood</div>
        <div class="mood-row" id="mood-row"></div>
        <div class="sum-total" id="mood-today"></div>
    </div>

    <!-- Water / hydration -->
    <div class="card">
        <div class="recent-title">Water</div>
        <div class="water-row">
            <button class="water-btn" id="water-minus">&minus;</button>
            <div class="water-count"><span class="g" id="water-glasses">0</span>
                <span id="water-goal"></span></div>
            <button class="water-btn" id="water-plus">+</button>
        </div>
        <div class="bar-track"><div class="bar-fill" id="water-fill" style="width:0%"></div></div>
    </div>

    <!-- Daily metric (weight) -->
    <div class="card">
        <div class="recent-title" id="metric-title">Weight</div>
        <div class="metric-latest" id="metric-latest"></div>
        <form class="metric-form" id="metric-form">
            <input type="number" step="0.1" id="metric-input" placeholder="Log today's number" inputmode="decimal">
            <button type="submit">Save</button>
        </form>
        <div class="spark" id="metric-spark"></div>
    </div>

    <!-- Today's summary (time per category) -->
    <div class="card">
        <div class="recent-title">Today</div>
        <div id="summary"></div>
    </div>

    <!-- Focus vs distraction -->
    <div class="card">
        <div class="recent-title">Focus vs Distraction</div>
        <div id="focus-ratio"></div>
    </div>

    <!-- App usage today (time + opens) -->
    <div class="card">
        <div class="recent-title">App Time - Today</div>
        <div id="app-today"></div>
    </div>

    <!-- App usage this week (7-day trend) -->
    <div class="card">
        <div class="recent-title">App Time - This Week</div>
        <div id="app-week"></div>
    </div>

    <!-- Sleep this week -->
    <div class="card">
        <div class="recent-title">Sleep - This Week</div>
        <div id="sleep-week"></div>
    </div>

    <div class="card">
        <div class="recent-title">Recent check-ins</div>
        <div id="recent"></div>
    </div>

    <div class="card btn-row">
        <button id="wake-btn"><span class="status-dot awake"></span>Awake</button>
        <button id="sleep-btn"><span class="status-dot asleep"></span>Sleep</button>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const res = await fetch("/status", { cache: "no-store" });
                return await res.json();
            } catch (e) { return null; }
        }

        function fmt(secs) {
            const m = Math.floor(secs / 60);
            const s = secs % 60;
            return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
        }

        function renderRecent(recent) {
            const el = document.getElementById("recent");
            if (!recent || recent.length === 0) {
                el.innerHTML = '<div class="recent-item"><span class="x">No check-ins yet</span></div>';
                return;
            }
            el.innerHTML = recent.slice().reverse().map(e => {
                const d = new Date(e.timestamp);
                const t = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
                const cat = e.category ? `<span class="cat">${e.category}</span>` : "";
                return `<div class="recent-item"><span class="t">${t}</span>${cat}<br><span class="x">${e.text}</span></div>`;
            }).join("");
        }

        function renderSummary(summary, total) {
            const el = document.getElementById("summary");
            if (!summary || summary.length === 0) {
                el.innerHTML = '<div class="sum-row"><span class="sum-cat">Nothing logged yet</span></div>';
                return;
            }
            const fmtVal = (s) => {
                if (s.count_only) return `\u00d7${s.count}`;
                const h = Math.floor(s.minutes / 60), mm = s.minutes % 60;
                return h ? `${h}h ${mm}m` : `${mm}m`;
            };
            el.innerHTML = summary.map(s =>
                `<div class="sum-row"><span class="sum-cat">${s.category}</span>` +
                `<span class="sum-time">${fmtVal(s)}</span></div>`
            ).join("") + `<div class="sum-total">${total} check-in(s) today</div>`;
        }

        function fmtDur(secs) {
            const m = Math.floor(secs / 60);
            const h = Math.floor(m / 60), mm = m % 60;
            return h ? `${h}h ${mm}m` : `${mm}m`;
        }

        function renderCompliance(c) {
            const el = document.getElementById("compliance-card");
            if (!c || c.expected === 0) {
                el.innerHTML = '<div class="recent-title">Compliance</div>' +
                    `<div class="sum-total">Streak: ${c ? c.streak : 0} days</div>`;
                el.style.borderLeft = "";
                return;
            }
            const behind = c.behind;
            el.style.borderLeft = behind ? "5px solid #e94560" : "5px solid #00d4ff";
            const color = behind ? "#e94560" : (c.percent >= 90 ? "#00d4ff" : "#eaeaea");
            el.innerHTML =
                '<div class="recent-title">Check-in Compliance</div>' +
                `<div style="font-size:1.6rem;font-weight:700;color:${color}">` +
                `${c.done}/${c.expected}  (${c.percent}%)</div>` +
                (behind ? `<div style="color:#e94560">\u26a0 ${c.missed} missed - catch up!</div>` : "") +
                `<div class="sum-total">Compliance streak: ${c.streak} days</div>`;
        }

        const MOOD_EMOJI = { 1: "\uD83D\uDE1E", 2: "\uD83D\uDE15", 3: "\uD83D\uDE10", 4: "\uD83D\uDE42", 5: "\uD83D\uDE04" };
        let moodBuilt = false;
        function buildMoodButtons() {
            if (moodBuilt) return;
            const row = document.getElementById("mood-row");
            row.innerHTML = "";
            for (let v = 1; v <= 5; v++) {
                const b = document.createElement("button");
                b.className = "mood-btn";
                b.textContent = MOOD_EMOJI[v];
                b.addEventListener("click", async () => {
                    await fetch("/mood", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ value: v })
                    });
                    refresh();
                });
                row.appendChild(b);
            }
            moodBuilt = true;
        }

        function renderMoodToday(moods) {
            const el = document.getElementById("mood-today");
            if (!moods || moods.length === 0) { el.textContent = "No mood logged yet"; return; }
            const avg = moods.reduce((a, m) => a + m.value, 0) / moods.length;
            const last = moods[moods.length - 1].value;
            el.textContent = `Latest ${MOOD_EMOJI[last]}  •  Avg ${avg.toFixed(1)}/5  (${moods.length} today)`;
        }

        async function logWater(delta) {
            const r = await fetch("/water?delta=" + delta);
            renderWater(await r.json());
        }

        function renderWater(w) {
            if (!w) return;
            document.getElementById("water-glasses").textContent = w.glasses;
            document.getElementById("water-goal").textContent = "/ " + w.goal + " glasses";
            const fill = document.getElementById("water-fill");
            fill.style.width = w.percent + "%";
            fill.classList.toggle("full", w.glasses >= w.goal);
        }

        function renderMetric(m) {
            if (!m) return;
            document.getElementById("metric-title").textContent = m.label || "Metric";
            const latest = document.getElementById("metric-latest");
            if (m.latest == null) {
                latest.innerHTML = '<span style="color:#8a8a9a">No entries yet</span>';
            } else {
                let chg = "";
                if (m.change != null && m.change !== 0) {
                    const cls = m.change > 0 ? "up" : "down";
                    const arrow = m.change > 0 ? "\u2191" : "\u2193";
                    chg = ` <span class="${cls}">${arrow}${Math.abs(m.change)}</span>`;
                }
                latest.innerHTML = `<span class="v">${m.latest}</span> ${m.unit || ""}${chg}`;
            }
            // sparkline over recent points
            const spark = document.getElementById("metric-spark");
            const pts = (m.points || []).slice(-14);
            if (pts.length < 2) { spark.innerHTML = ""; return; }
            const vals = pts.map(p => p.value);
            const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
            spark.innerHTML = pts.map(p => {
                const h = 15 + Math.round(((p.value - lo) / span) * 85);
                return `<div class="col"><div class="b" style="height:${h}%" title="${p.date}: ${p.value}"></div></div>`;
            }).join("");
        }

        function renderFocus(fs) {
            const el = document.getElementById("focus-ratio");
            if (!fs || (!fs.focus_sec && !fs.distraction_sec)) {
                el.innerHTML = '<div class="app-row"><span class="app-name">No data yet</span></div>';
                return;
            }
            const f = fs.focus_sec, d = fs.distraction_sec, total = f + d || 1;
            const fpct = Math.round((f / total) * 100);
            el.innerHTML =
                `<div class="app-row"><span class="app-name" style="color:#00d4ff">Focus</span>` +
                `<span class="app-val">${fmtDur(f)}</span></div>` +
                `<div class="app-row"><span class="app-name" style="color:#e94560">Distraction</span>` +
                `<span style="color:#e94560">${fmtDur(d)}</span></div>` +
                `<div style="height:10px;border-radius:5px;overflow:hidden;background:#e94560;margin:8px 0;">` +
                `<div style="height:100%;width:${fpct}%;background:#00d4ff;"></div></div>` +
                (fs.longest_focus_sec ?
                 `<div class="sum-total">Longest focus streak: ${fmtDur(fs.longest_focus_sec)}</div>` : "");
        }

        function renderAppToday(usage) {
            const el = document.getElementById("app-today");
            if (!usage || usage.length === 0) {
                el.innerHTML = '<div class="app-row"><span class="app-name">None today</span></div>';
                return;
            }
            el.innerHTML = usage.map(a => {
                const over = a.over_limit ? ' style="color:#e94560"' : '';
                const valCls = a.over_limit ? 'style="color:#e94560"' : 'class="app-val"';
                return `<div class="app-row"><span class="app-name"${over}>${a.app}` +
                    `${a.over_limit ? ' \u26a0' : ''}</span>` +
                    `<span><span ${valCls}>${fmtDur(a.seconds)}</span>` +
                    `<span class="app-opens">${a.opens}\u00d7</span></span></div>`;
            }).join("");
        }

        function renderAppWeek(week) {
            const el = document.getElementById("app-week");
            if (!week || !week.apps || week.apps.length === 0) {
                el.innerHTML = '<div class="app-row"><span class="app-name">No data this week</span></div>';
                return;
            }
            const days = week.days || [];
            el.innerHTML = week.apps.map(a => {
                const peak = Math.max(1, ...a.daily);
                const bars = a.daily.map((sec, i) => {
                    const pct = Math.round((sec / peak) * 100);
                    const cls = sec > 0 ? "week-bar" : "week-bar empty";
                    const h = sec > 0 ? Math.max(6, pct) : 4;
                    return `<div class="week-bar-col">` +
                        `<div class="${cls}" style="height:${h}%"></div>` +
                        `<div class="week-day">${days[i] || ""}</div></div>`;
                }).join("");
                return `<div class="week-app">` +
                    `<div class="week-head"><span class="app-name">${a.app}</span>` +
                    `<span><span class="app-val">${fmtDur(a.seconds)}</span>` +
                    `<span class="app-opens">${a.opens}\u00d7</span></span></div>` +
                    `<div class="week-bars">${bars}</div></div>`;
            }).join("");
        }

        function fmtClock(min) {
            if (min === null || min === undefined) return "--";
            const h = Math.floor(((min % 1440) + 1440) % 1440 / 60);
            const m = (((min % 60) + 60) % 60);
            return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
        }

        function fmtHrs(min) {
            if (min === null || min === undefined) return "--";
            const h = Math.floor(min / 60), m = min % 60;
            return h ? `${h}h ${m}m` : `${m}m`;
        }

        function renderSleep(sl) {
            const el = document.getElementById("sleep-week");
            if (!sl || !sl.nights || sl.nights.length === 0) {
                el.innerHTML = '<div class="app-row"><span class="app-name">' +
                    (sl && sl.in_bed ? "In bed - tap Awake when you get up" : "No sleep logged yet") +
                    '</span></div>';
                return;
            }
            // summary line
            const reg = sl.bedtime_regularity_min;
            const regTxt = (reg === null || reg === undefined) ? "--" : `\u00b1${reg}m`;
            const regColor = (reg === null) ? "#8b95a5" : (reg <= 30 ? "#00d4ff" : (reg <= 60 ? "#f5a623" : "#e94560"));
            let html =
                `<div class="app-row"><span class="app-name">Avg bedtime</span>` +
                `<span class="app-val">${fmtClock(sl.avg_bedtime_min)}</span></div>` +
                `<div class="app-row"><span class="app-name">Avg wake</span>` +
                `<span class="app-val">${fmtClock(sl.avg_waketime_min)}</span></div>` +
                `<div class="app-row"><span class="app-name">Avg duration</span>` +
                `<span class="app-val">${fmtHrs(sl.avg_duration_min)}</span></div>` +
                `<div class="app-row"><span class="app-name">Bedtime regularity</span>` +
                `<span style="color:${regColor}">${regTxt}</span></div>`;
            if (sl.in_bed) {
                html += `<div class="sum-total" style="color:#f5a623">Currently in bed</div>`;
            }
            // per-night bars (duration), scaled to peak
            const peak = Math.max(1, ...sl.nights.map(n => n.duration_min));
            const dow = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
            const bars = sl.nights.map(n => {
                const pct = Math.max(6, Math.round((n.duration_min / peak) * 100));
                const d = new Date(n.date + "T00:00:00");
                const lbl = isNaN(d) ? "" : dow[d.getDay()];
                return `<div class="week-bar-col">` +
                    `<div class="week-bar" style="height:${pct}%"></div>` +
                    `<div class="week-day">${lbl}</div></div>`;
            }).join("");
            html += `<div class="week-app"><div class="week-head">` +
                `<span class="app-name">Nightly sleep</span>` +
                `<span class="app-val">last ${fmtHrs(sl.last_duration_min)}</span></div>` +
                `<div class="week-bars">${bars}</div></div>`;
            // detail rows
            html += sl.nights.slice().reverse().map(n => {
                const d = new Date(n.date + "T00:00:00");
                const lbl = isNaN(d) ? n.date : dow[d.getDay()];
                return `<div class="app-row"><span class="app-name">${lbl} ` +
                    `${fmtClock(n.bed_min)}\u2192${fmtClock(n.wake_min)}</span>` +
                    `<span class="app-val">${fmtHrs(n.duration_min)}</span></div>`;
            }).join("");
            el.innerHTML = html;
        }

        let quickBuilt = false;
        function buildQuickButtons(categories) {
            if (quickBuilt || !categories) return;
            const grid = document.getElementById("quick-grid");
            grid.innerHTML = "";
            categories.forEach(cat => {
                const b = document.createElement("button");
                b.textContent = cat;
                b.addEventListener("click", () => logCheckin(cat, cat));
                grid.appendChild(b);
            });
            quickBuilt = true;
        }

        async function logCheckin(text, category) {
            await fetch("/log", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text, category: category || null })
            });
            pending = false;
            refresh();
        }

        let remaining = 0;
        let pending = false;

        async function refresh() {
            const s = await fetchStatus();
            if (!s) return;
            remaining = s.next_checkin_in;
            pending = s.notification_pending;
            buildQuickButtons(s.categories);
            renderRecent(s.recent);
            renderSummary(s.summary, s.total_checkins);
            renderCompliance(s.compliance);
            buildMoodButtons();
            renderMoodToday(s.moods);
            renderFocus(s.focus);
            renderAppToday(s.app_usage);
            renderAppWeek(s.app_week);
            renderSleep(s.sleep);
            renderWater(s.water);
            // Don't clobber the metric input while the user is typing in it.
            if (document.activeElement !== document.getElementById("metric-input")) {
                renderMetric(s.metric);
            }
            updateCountdown();
        }

        function updateCountdown() {
            const cd = document.getElementById("countdown");
            const timeEl = document.getElementById("cd-time");
            const labelEl = document.getElementById("cd-label");
            if (pending) {
                cd.classList.add("pending");
                timeEl.textContent = "Check in!";
                labelEl.textContent = "tap a quick button";
            } else {
                cd.classList.remove("pending");
                timeEl.textContent = fmt(Math.max(0, remaining));
                labelEl.textContent = "until next check-in";
            }
        }

        // Local countdown tick between server refreshes
        setInterval(() => { if (remaining > 0 && !pending) { remaining--; updateCountdown(); } }, 1000);
        setInterval(refresh, 15000);

        document.getElementById("add-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const input = document.getElementById("entry");
            const text = input.value.trim();
            if (!text) return;
            await logCheckin(text, null);
            input.value = "";
        });

        document.getElementById("wake-btn").addEventListener("click", async () => {
            await fetch("/wake", { method: "POST" });
            refresh();
        });
        document.getElementById("sleep-btn").addEventListener("click", async () => {
            await fetch("/sleep", { method: "POST" });
            refresh();
        });

        document.getElementById("water-plus").addEventListener("click", () => logWater(1));
        document.getElementById("water-minus").addEventListener("click", () => logWater(-1));
        document.getElementById("metric-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const inp = document.getElementById("metric-input");
            const v = parseFloat(inp.value);
            if (isNaN(v)) return;
            const r = await fetch("/metric?value=" + v);
            inp.value = "";
            inp.blur();
            renderMetric(await r.json());
        });

        refresh();
    </script>
</body>
</html>
