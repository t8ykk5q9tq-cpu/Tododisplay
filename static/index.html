<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Board</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav id="site-nav" style="display:flex;flex-wrap:wrap;gap:8px;padding:14px 14px 0;"></nav>
    <script>
    (function () {
        var host = location.hostname, proto = location.protocol;
        var p5000 = proto + "//" + host + ":5000", p5050 = proto + "//" + host + ":5050";
        var here = location.port + location.pathname.replace(/\/$/, "");
        var links = [
            ["Lists", p5000 + "/", "5000"],
            ["Board", p5000 + "/board", "5000/board"],
            ["Tracker", p5050 + "/", "5050"],
            ["Usage", p5050 + "/usage", "5050/usage"],
            ["Health", p5050 + "/health", "5050/health"],
            ["Weekly", p5050 + "/weekly-review", "5050/weekly-review"],
            ["Insights", p5050 + "/insights", "5050/insights"],
        ];
        document.getElementById("site-nav").innerHTML = links.map(function (l) {
            var on = (here === l[2]);
            var base = "padding:6px 14px;border-radius:999px;text-decoration:none;"
                + "font-size:14px;font-weight:600;border:1px solid #22284a;";
            var style = on ? base + "background:#00d4ff;color:#12122a;border-color:#00d4ff;"
                           : base + "background:#16213e;color:#00d4ff;";
            return "<a href=\"" + l[1] + "\" style=\"" + style + "\">" + l[0] + "</a>";
        }).join("");
    })();
    </script>

    <!-- Focus for today -->
    <div class="focus-panel">
        <form class="focus-form" id="focus-form">
            <span class="focus-label">Today's Focus:</span>
            <input type="text" id="focus-input" placeholder="Set your focus for today..." autocomplete="off">
            <button type="submit">Set</button>
        </form>
    </div>

    <!-- Habits -->
    <div class="habits-panel">
        <div class="habits-header">
            <h1>Today's Habits</h1>
            <form class="add-habit-form" id="add-habit-form">
                <input type="text" placeholder="Add habit..." autocomplete="off">
                <button type="submit">+</button>
            </form>
        </div>
        <div class="habits-row" id="habits-row"></div>
    </div>

    <div class="container">
        <!-- Todo List -->
        <div class="list-panel">
            <h1>Todo List</h1>
            <form class="add-form" data-list="todo">
                <input type="text" placeholder="Add a task..." autocomplete="off">
                <button type="submit">+</button>
            </form>
            <ul class="item-list" id="todo-list"></ul>
            <button class="clear-btn" data-list="todo">Clear completed</button>
        </div>

        <!-- Shopping List -->
        <div class="list-panel">
            <h1>Shopping List</h1>
            <form class="add-form" data-list="shopping">
                <input type="text" placeholder="Add an item..." autocomplete="off">
                <button type="submit">+</button>
            </form>
            <ul class="item-list" id="shopping-list"></ul>
            <button class="clear-btn" data-list="shopping">Clear completed</button>
        </div>
    </div>

    <div class="clock" id="clock"></div>

    <script src="/static/app.js"></script>
</body>
</html>
